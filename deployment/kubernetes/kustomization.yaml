# Local cluster stack. Ingress is not included.
# Apply the ingress file only when a controller exists.
# EKS should use the Helm chart with values-eks.yaml instead of this directory,
# so RDS is not replaced by this StatefulSet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - secret.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - api-deployment.yaml
  - api-service.yaml
  - ui-deployment.yaml
  - ui-service.yaml
