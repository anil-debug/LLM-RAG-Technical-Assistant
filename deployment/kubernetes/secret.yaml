apiVersion: v1
kind: Secret
metadata:
  name: technical-rag-secret
  labels:
    app.kubernetes.io/name: technical-rag-assistant
type: Opaque
stringData:
  # Local cluster password, the same placeholder Compose uses.
  # For EKS, do not apply the Postgres manifests. Put the RDS URL here instead.
  POSTGRES_USER: rag
  POSTGRES_PASSWORD: rag
  POSTGRES_DB: rag
  DATABASE_URL: postgresql://rag:rag@technical-rag-postgres:5432/rag
  LLM_API_KEY: ollama
