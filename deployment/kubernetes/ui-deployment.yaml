apiVersion: apps/v1
kind: Deployment
metadata:
  name: technical-rag-ui
  labels:
    app.kubernetes.io/name: technical-rag-assistant
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: technical-rag-assistant
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technical-rag-assistant
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: technical-rag-assistant:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: API_BASE_URL
              value: http://technical-rag-api:8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
