apiVersion: apps/v1
kind: Deployment
metadata:
  name: technical-rag-api
  labels:
    app.kubernetes.io/name: technical-rag-assistant
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: technical-rag-assistant
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technical-rag-assistant
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: technical-rag-assistant:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: technical-rag-config
            - secretRef:
                name: technical-rag-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          emptyDir: {}
