# Self-contained cluster: API, UI, and PostgreSQL 16 with pgvector.
# This does not require Docker Compose.
# For AWS, use values-eks.yaml and point secret.databaseUrl at RDS.
# For Minikube, use values-minikube.yaml so the locally loaded image is used.
# The password below is a local cluster placeholder. Do not reuse it on RDS.

nameOverride: ""
fullnameOverride: ""

image:
  repository: technical-rag-assistant
  tag: "0.1.0"
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

ui:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8501
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

config:
  vectorBackend: postgres
  embeddingModel: BAAI/bge-base-en-v1.5
  embeddingDim: "768"
  embeddingDevice: cpu
  chunkTokenizer: regex
  llmProvider: openai_compatible
  llmBaseUrl: http://ollama:11434/v1
  llmModel: qwen2.5:3b
  rerankerEnabled: "false"
  logLevel: INFO

# Empty databaseUrl is filled with the in-cluster Postgres service.
# Set it when postgres.enabled is false (RDS or another external database).
secret:
  databaseUrl: ""
  llmApiKey: ollama

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  pullPolicy: IfNotPresent
  user: rag
  password: rag
  database: rag
  storage: 5Gi
  # Empty uses the cluster default StorageClass.
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  enabled: false
  className: alb
  host: rag.example.com
  annotations: {}

gpu:
  enabled: false
  nodeSelector: {}
  tolerations: []
  nvidiaGpu: "1"

serviceAccount:
  create: true
  name: ""
