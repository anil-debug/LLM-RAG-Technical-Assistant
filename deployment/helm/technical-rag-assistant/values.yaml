# Defaults target a cluster that does not yet have RDS or a GPU.
# Switch vectorBackend to postgres and set databaseUrl before production use.
# This chart was rendered with `helm template`. It was not installed on a cluster.

nameOverride: ""
fullnameOverride: ""

image:
  repository: technical-rag-assistant
  tag: "0.1.0"
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

ui:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8501
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

config:
  vectorBackend: memory
  embeddingModel: BAAI/bge-base-en-v1.5
  embeddingDim: "768"
  embeddingDevice: cpu
  chunkTokenizer: regex
  llmProvider: openai_compatible
  llmBaseUrl: http://ollama:11434/v1
  llmModel: qwen2.5:3b
  rerankerEnabled: "false"
  logLevel: INFO

secret:
  # Local placeholder. Replace from AWS Secrets Manager or an external secret store.
  databaseUrl: postgresql://rag:change-me@postgres:5432/rag
  llmApiKey: ollama

ingress:
  enabled: false
  className: alb
  host: rag.example.com
  annotations: {}

gpu:
  enabled: false
  nodeSelector: {}
  tolerations: []
  nvidiaGpu: "1"

serviceAccount:
  create: true
  name: ""
