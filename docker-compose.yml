# Local stack: API, Streamlit, PostgreSQL 16 with pgvector.
# The database password is a local development value. Do not reuse it in AWS.
# `docker compose config` validates this file. An image build is a separate step.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      VECTOR_BACKEND: postgres
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      EMBEDDING_DEVICE: cpu
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      CHUNK_TOKENIZER: regex
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
