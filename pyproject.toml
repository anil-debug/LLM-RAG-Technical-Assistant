[project]
name = "technical-rag-assistant"
version = "0.1.0"
description = "Technical RAG assistant for server-platform documents."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "accelerate>=1.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "peft>=0.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.40",
    "torch>=2.2",
    "transformers>=4.45",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.43"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "ingestion",
    "intelligence",
    "embeddings",
    "retrieval",
    "generation",
    "evaluation",
    "api",
    "finetune",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
